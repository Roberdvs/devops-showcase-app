name: Coverage Comment

# Posts the unit test coverage summary produced by ci-tests.yaml as a PR
# comment. This runs on workflow_run instead of inside CI Tests because
# pull_request runs from forks only get a read-only GITHUB_TOKEN and cannot
# comment. workflow_run jobs execute in the context of this repository with
# the permissions declared below, so they can comment on fork PRs too.
#
# Nothing from the PR is checked out or executed here; only the uploaded
# markdown file is read and posted.
on:
  workflow_run:
    workflows: ["CI Tests"]
    types:
      - completed

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    name: Coverage Comment
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download coverage summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-comment
          path: coverage-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const headSha = context.payload.workflow_run.head_sha;

            // workflow_run.pull_requests is empty for PRs from forks, so find
            // the PR by matching the run's head SHA against the open PRs.
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const pr = pulls.find((p) => p.head.sha === headSha);
            if (!pr) {
              core.info(`No open PR with head ${headSha}, skipping comment`);
              return;
            }

            const marker = '<!-- coverage-comment -->';
            const body = `${marker}\n${fs.readFileSync('coverage-comment/comment.md', 'utf8')}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.startsWith(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated coverage comment on #${pr.number}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
              core.info(`Created coverage comment on #${pr.number}`);
            }
