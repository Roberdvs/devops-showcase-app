name: PR Title

# Validates the PR title against the release-drafter category pipeline in
# .github/release-drafter.yml, so this check and the release categorization
# share one source of truth: the title must select a category there
# (feat/fix/chore/... per the Conventional Commits spec), and a title that
# only lands in the unconditional "Other Changes" fallback fails. Labels OR
# with titles in the categories, so a PR carrying a category label
# (dependencies, bug, enhancement, ...) passes regardless of its title;
# labeled/unlabeled events re-run the check when such a label changes.
#
# pull_request_target (not pull_request) so the check also runs with a valid
# token on PRs from forks; the action only reads PR metadata from the event
# payload and the config from the base branch. It never checks out or
# executes PR code, so this is safe.
on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - labeled
      - unlabeled

permissions:
  contents: read

jobs:
  validate:
    name: Validate conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter/check-pr@72967cdc98ddd3160f1fc3dff619de365e137dd0 # v7.9.0
