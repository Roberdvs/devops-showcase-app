name: CI Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# pull_request runs from forks only get a read-only GITHUB_TOKEN, so this
# workflow never writes to the PR. The coverage summary is uploaded as an
# artifact and posted as a comment by coverage-comment.yaml, which runs on
# workflow_run in the context of this repository and can comment on any PR.
permissions:
  contents: read

jobs:
  ci-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run unit tests
        run: |
          uv run coverage run -m pytest app/tests/unit/
          uv run coverage report

      - name: Write coverage summary
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p coverage-comment
          {
            echo "## Code Coverage"
            echo
            uv run coverage report --format=markdown
            echo
            echo "_Unit test coverage for \`${HEAD_SHA}\`_"
          } > coverage-comment/comment.md

      - name: Upload coverage summary
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-comment
          path: coverage-comment/comment.md

      - name: Run integration tests
        run: make integration-tests
