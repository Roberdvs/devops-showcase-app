name: Build and Push Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  # Lets the Trivy SARIF report land in the repository's code scanning view.
  security-events: write

jobs:
  build-and-push:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        # For pull_request events GITHUB_SHA is the ephemeral merge commit, so
        # type=sha would tag sha-<merge>. The e2e workflow derives the tag from
        # workflow_run.head_sha (the PR head commit), so the tags must match the
        # PR head SHA — otherwise the pull fails with "manifest unknown".
        env:
          DOCKER_METADATA_PR_HEAD_SHA: true
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PRs from forks run with a read-only GITHUB_TOKEN and cannot push to
      # GHCR, so build a single-platform image into the local Docker daemon
      # instead. The Dockerfile and the Trivy scan still get exercised; only
      # the push is skipped, which is why e2e-tests.yaml does not run for
      # fork PRs.
      - name: Resolve build mode
        id: mode
        env:
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$IS_FORK_PR" = "true" ]; then
            {
              echo "push=false"
              echo "load=true"
              echo "platforms=linux/amd64"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "push=true"
              echo "load=false"
              echo "platforms=linux/amd64,linux/arm64"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          platforms: ${{ steps.mode.outputs.platforms }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ steps.mode.outputs.push }}
          load: ${{ steps.mode.outputs.load }}

      # Scan exactly the image this run produced. The tags above are mutable
      # (`main`, `pr-123`): an overlapping run for the same ref could replace
      # them between the push and the scan, and the job would then grade a
      # different image. The pushed digest cannot change. Fork builds are
      # never pushed, so their locally loaded tag is the only reference.
      - name: Resolve image reference to scan
        id: scan
        env:
          PUSHED: ${{ steps.mode.outputs.push }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          if [ "$PUSHED" = "true" ]; then
            echo "ref=ghcr.io/${GITHUB_REPOSITORY@L}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      # Two Trivy passes. The first records every finding that has a fix
      # available, at any severity, as SARIF for the repository's code
      # scanning view; it covers the amd64 image, the platform of the runner.
      # The second fails the job on CRITICAL/HIGH findings that have a fix, on
      # every published platform, so an image with a known fixable
      # vulnerability never gets a green check. Unfixed findings are left out
      # of both: nothing can be done about them until upstream ships a patch,
      # and the Debian base image alone carries a few hundred, which would
      # bury the actionable ones.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.scan.outputs.ref }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true

      # Fork PRs run with a read-only token that cannot write to code scanning.
      - name: Upload Trivy results to code scanning
        if: steps.mode.outputs.push == 'true'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # The amd64 and arm64 images are separate builds whose packages can
      # differ, and Trivy only scans the platform matching the runner unless
      # told otherwise, so the gate runs once per published platform. The
      # step above installed Trivy on PATH and populated its database cache.
      - name: Fail on fixable CRITICAL/HIGH vulnerabilities
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
          PLATFORMS: ${{ steps.mode.outputs.platforms }}
          IMAGE_REF: ${{ steps.scan.outputs.ref }}
        run: |
          IFS=, read -ra platforms <<< "$PLATFORMS"
          for platform in "${platforms[@]}"; do
            echo "::group::${platform}"
            trivy image --platform "$platform" --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$IMAGE_REF"
            echo "::endgroup::"
          done
